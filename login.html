<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>TVB 会员登录</title>
    <style>
        body {
            background: #1a1a2e;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 50px;
        }
        .login-box {
            background: #16213e;
            padding: 30px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }
        button {
            background: #e63946;
            color: white;
            padding: 10px 20px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>📺 TVB 会员登录</h1>
    <div class="login-box">
        <form method="POST">
            <input type="text" name="username" placeholder="请输入账号" required><br>
            <input type="password" name="password" placeholder="请输入密码" required><br>
            <button type="submit">登录</button>
        </form>
    </div>
</body>
</html>
