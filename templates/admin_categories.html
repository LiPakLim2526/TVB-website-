{% extends "admin_layout.html" %}

{% block content %}

    <h2>🏷️ 分類管理中心</h2>
    
    <div class="card my-4 p-4 shadow-sm border-0">
        <h4>新增影片分類</h4>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">分類名稱</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">英文縮寫</label>
                <input type="text" name="slug" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">分類描述</label>
                <textarea name="description" class="form-control" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">新增分類</button>
        </form>
    </div>

    <table class="table table-hover bg-white shadow-sm">
        <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>分類名稱</th>
                <th>英文縮寫</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for c in categories %}
            <tr>
                <td>{{ c.category_id }}</td>
                <td>{{ c.name }}</td>
                <td>{{ c.slug }}</td>
                <td>
                    <a href="/admin/categories/edit/{{ c.category_id }}" class="btn btn-warning btn-sm">編輯</a>
                    <a href="/admin/categories/delete/{{ c.category_id }}" class="btn btn-danger btn-sm" onclick="return confirm('確定刪除？')">刪除</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock %}
