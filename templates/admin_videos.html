{% extends "admin_layout.html" %}
{% block content %}

    <h2>🎬 影片管理中心</h2>
    
    <div class="card my-4 p-4 shadow-sm border-0">
        <h4>新增影片內容</h4>
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">影片標題</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">所屬分類</label>
                    <select name="category_id" class="form-select" required>
                        <option value="">-- 請選擇分類 --</option>
                        {% for c in categories %}
                        <option value="{{ c.category_id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">封面圖片網址</label>
                <input type="text" name="cover_url" class="form-control" placeholder="https://...">
            </div>
            <div class="mb-3">
                <label class="form-label">影片連結 (YouTube/Vimeo)</label>
                <input type="text" name="video_url" class="form-control" placeholder="https://...">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">影片時長 (秒)</label>
                    <input type="number" name="duration" class="form-control" placeholder="例如：120">
                </div>
            </div>
            <button type="submit" class="btn btn-primary">確認新增影片</button>
        </form>
    </div>

    <table class="table table-hover bg-white shadow-sm">
        <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>封面</th>
                <th>標題</th>
                <th>分類</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for v in videos %}
            <tr>
                <td>{{ v.video_id }}</td>
                <td><img src="{{ v.cover_url }}" width="80" class="rounded"></td>
                <td>{{ v.title }}</td>
                <td><span class="badge bg-info text-dark">{{ v.category.name }}</span></td>
                <td>
                    <a href="/admin/videos/edit/{{ v.video_id }}" class="btn btn-warning btn-sm">編輯</a>
                    <a href="/admin/videos/delete/{{ v.video_id }}" class="btn btn-danger btn-sm" onclick="return confirm('確定刪除？')">刪除</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock %}
