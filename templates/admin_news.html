{% extends "admin_layout.html" %}

{% block content %}

    <h2>📰 新聞管理中心</h2>
    
    <div class="card my-4 p-4 shadow-sm border-0">
        <h4>發布新消息</h4>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">新聞標題</label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">內容文字</label>
                <textarea name="content" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">圖片網址</label>
                <input type="text" name="image_url" class="form-control" placeholder="https://...">
            </div>
            <div class="mb-3">
                <label class="form-label">連結網址</label>
                <input type="text" name="link_url" class="form-control" placeholder="https://...">
            </div>
            <button type="submit" class="btn btn-primary">立即發布</button>
        </form>
    </div>

    <table class="table table-hover bg-white shadow-sm">
        <thead class="table-light">
            <tr>
                <th>排序</th>
                <th>預覽圖</th>
                <th>標題</th>
                <th>發布時間</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for a in articles %}
            <tr>
                <td>
                    <form method="POST" action="/admin/news/update_order/{{ a.article_id }}">
                        <input type="number" name="display_order" value="{{ a.display_order }}" min="0">
                        <button type="submit" class="btn btn-primary btn-sm">更新</button>
                    </form>
                </td>
                <td><img src="{{ a.image_url }}" width="80" class="rounded"></td>
                
                <td>{{ a.title }}</td>
                <td>{{ a.published_at.strftime('%Y-%m-%d') }}</td>
                <td>
                    <a href="/admin/news/edit/{{ a.article_id }}" class="btn btn-warning btn-sm">編輯</a>
                    <a href="/admin/news/delete/{{ a.article_id }}" class="btn btn-danger btn-sm" onclick="return confirm('確定要刪除嗎？')">刪除</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock %}
