<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>TVB 後台管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        body { background: #f0f2f5; padding: 20px; }
        .admin-header { background: #003366; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #003366; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .video-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .video-item { border: 1px solid #eee; border-radius: 4px; padding: 10px; }
        .delete-btn { background: #dc3545; margin-top: 8px; }
        .flash { padding: 10px; background: #d4edda; color: #155724; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1>TVB 內容管理後台</h1>
        <a href="/admin/logout" style="color: white;">登出</a>
    </div>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="flash">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}

    <!-- 上传剧集 -->
    <div class="card">
        <h2>上傳新劇集</h2>
        <form action="/admin/video/add" method="post">
            <div class="form-group">
                <label>劇集標題</label>
                <input type="text" name="title" required>
            </div>
            <div class="form-group">
                <label>封面圖片網址</label>
                <input type="url" name="cover_url" required>
            </div>
            <div class="form-group">
                <label>劇集簡介</label>
                <textarea name="description" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>所屬分類</label>
                <select name="category_id" required>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit">上傳</button>
        </form>
    </div>

    <!-- 新增Banner -->
    <div class="card">
        <h2>新增首頁Banner</h2>
        <form action="/admin/banner/add" method="post">
            <div class="form-group">
                <label>Banner標題</label>
                <input type="text" name="title">
            </div>
            <div class="form-group">
                <label>Banner圖片網址</label>
                <input type="url" name="image_url" required>
            </div>
            <div class="form-group">
                <label>跳轉鏈接（可選）</label>
                <input type="url" name="link_url" placeholder="https://">
            </div>
            <button type="submit">新增</button>
        </form>
    </div>

    <!-- 新增分类 -->
    <div class="card">
        <h2>新增內容分類</h2>
        <form action="/admin/category/add" method="post">
            <div class="form-group">
                <label>分類名稱</label>
                <input type="text" name="name" required>
            </div>
            <button type="submit">新增</button>
        </form>
    </div>

    <!-- 已上传剧集列表 -->
    <div class="card">
        <h2>已上傳劇集（點擊刪除）</h2>
        <div class="video-grid">
            {% for video in videos %}
            <div class="video-card">
                <img src="{{ video.cover_url }}" width="100%" height="100" style="object-fit: cover;">
                <div style="padding: 8px;">
                    <p style="font-weight: bold;">{{ video.title }}</p>
                    <p style="font-size: 12px; color: #666;">{{ video.category.name }}</p>
                    <a href="/admin/video/delete/{{ video.id }}" class="delete-btn" style="color: white; font-size: 12px;">刪除</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
