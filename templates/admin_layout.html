<!DOCTYPE html>
<html>
<head>
    <title>TVB 愛心基金 - 後台管理系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background-color: #212529; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 12px 20px; font-size: 1.1rem; }
        .sidebar a:hover { color: #fff; background-color: #343a40; border-left: 4px solid #0d6efd; }
        .content { padding: 30px; background-color: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            
            <div class="col-md-2 sidebar px-0">
                <h4 class="text-white text-center mb-4">後台管理系統</h4>
                <a href="/admin/news">📰 新聞管理</a>
                <a href="/admin/categories">🏷️ 分類管理</a>
                <a href="/admin/videos">🎬 影片管理</a>
                <a href="/admin/banners">🖼️ 橫幅管理</a>
                <a href="{{ url_for('admin_datacenter') }}" style="color: white; text-decoration: none; display: block; padding: 10px 0;">🗂️ 資料中心管理</a>
                <hr class="text-secondary mx-3">
                
                <a href="/" target="_blank" class="text-warning">👁️ 預覽前台首頁</a>
            </div>

            <div class="col-md-10 content">
                
                {% block content %}
                {% endblock %}
                
            </div>
        </div>
    </div>
</body>
</html>
