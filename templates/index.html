<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVB - 主頁</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #ffffff; color: #333; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
        
        /* 導航欄樣式 */
        .navbar { border-bottom: 1px solid #eee; padding: 10px 0; }
        .nav-link { color: #333 !important; font-weight: 500; margin-right: 15px; }
        .search-bar { background-color: #f2f2f2; border-radius: 20px; border: none; padding: 5px 15px; }

        /* 大 Banner 圓角 */
        .main-banner { border-radius: 20px; overflow: hidden; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* Cookie 提示條 */
        .cookie-banner {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1000px; background-color: rgba(26, 26, 26, 0.95);
            color: white; padding: 15px 25px; border-radius: 10px; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top bg-white">
    <div class="container">
        <a class="navbar-brand" href="#"><img src="https://upload.wikimedia.org/wikipedia/zh/thumb/b/bc/TVB-Logo.svg/250px-TVB-Logo.svg.png" width="80"></a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="#">主頁</a></li>
                <li class="nav-item"><a class="nav-link" href="#">娛樂焦點</a></li>
                <li class="nav-item"><a class="nav-link" href="#">節目重溫</a></li>
                <li class="nav-item"><a class="nav-link" href="#">健康生活</a></li>
                <li class="nav-item"><a class="nav-link" href="#">愛心基金</a></li>
            </ul>
            <div class="d-flex align-items-center">
                <input class="search-bar me-3" type="text" placeholder="搜尋">
                <img src="https://cdn-icons-png.flaticon.com/512/1144/1144760.png" width="30">
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="main-banner">
        <div class="row g-0 bg-dark text-white align-items-center">
            <div class="col-md-8">
                <img src="https://www.tvb.com/thumbor/5UTxyelo7_X7ifiVzTdIPPnjQio=/1530x0/filters:water(21):quality(80)/public/tvbcom/article/images/202603/3641c734-2637-498c-9148-2ecab728418c.png" class="img-fluid">
            </div>
            <div class="col-md-4 p-4">
                <h2>TVB實現轉正溢利5,900萬</h2>
                <p>TVB業績2025｜TVB實現轉正溢利5,900萬 本集團EBITDA港幣3.65億</p>
            </div>
        </div>
    </div>
</div>
<div class="container mt-4">
    <div class="row mb-3">
        <div class="col-12 d-flex align-items-center">
            <div style="width: 4px; height: 22px; background-color: #0056b3; margin-right: 12px;"></div>
            <h4 class="fw-bold mb-0">最新內容</h4>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8 col-md-12">
            <div class="row">
                {% for video in videos[:4] %}
                <div class="col-md-6 mb-4">
                    <div class="card border-0 shadow-sm h-100 rounded-3">
                        <div class="ratio ratio-16x9">
                            <img src="{{ video[2] }}" class="card-img-top rounded-top-3" style="object-fit: cover;">
                        </div>
                        <div class="card-body p-2">
                            <h6 class="fw-bold mb-1 text-truncate-2" style="font-size: 14.5px;">{{ video[0] }}</h6>
                            <small class="text-muted" style="font-size: 12px;">{{ video[1] }}</small>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="col-lg-4 ps-lg-4 d-none d-lg-block">
            {% for video in videos[4:9] %}
            <div class="d-flex align-items-start mb-3 border-bottom pb-2">
                <div style="flex-shrink: 0; width: 140px;"> 
                    <div class="ratio ratio-16x9">
                        <img src="{{ video[2] }}" class="rounded-2" style="object-fit: cover;">
                    </div>
                </div>
                <div class="ms-3 overflow-hidden">
                    <h6 class="fw-bold mb-1 text-truncate-2" style="font-size: 14px; line-height: 1.3;">
                        {{ video[0] }}
                    </h6>
                    <small class="text-muted" style="font-size: 11px;">{{ video[1] }}</small>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<div class="cookie-banner" id="cookieBox">
    <div>
        🍪 本服務使用 Cookies 以維持可靠性  <a href="#" class="text-info">Cookies 政策</a>
    </div>
    <button class="btn btn-primary btn-sm ms-3" onclick="document.getElementById('cookieBox').style.display='none'">同意</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
