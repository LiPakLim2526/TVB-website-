version: '3.8'

services:
  # 資料庫容器 (1 db container)
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootroot
      MYSQL_DATABASE: tvb_charity_db
    ports:
      - "3306:3306"

  # 第一個網頁伺服器 (2 web server containers 之一)
  web1:
    build: .
    ports:
      - "5001:5000"
    depends_on:
      - db
    environment:
      - DB_HOST=db

  # 第二個網頁伺服器 (2 web server containers 之二)
  web2:
    build: .
    ports:
      - "5002:5000"
    depends_on:
      - db
    environment:
      - DB_HOST=db